[project]
name = "aisla-opt"
version = "4.5.0"
description = "Selección termo-económica del aislamiento de la envolvente de cuartos refrigerados."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Uso académico" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W/F: errores y estilo PEP 8 · I: orden de imports · B: errores probables
# UP: sintaxis moderna · SIM: simplificaciones · RUF: reglas propias de Ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: caracteres ambiguos (×, −, –) son intencionales en textos en español.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["aisla_opt", "interfaz"]
